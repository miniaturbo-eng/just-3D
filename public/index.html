<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JUST3D — Impression 3D</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>JUST<span>3D</span></h1>
    <p>Vente d'impressions 3D — pièces, figurines et prototypes</p>
  </header>

  <main>
    <section id="products-section">
      <div class="section-head">
        <h2>Nos produits</h2>
        <button id="toggle-admin">+ Ajouter un produit</button>
      </div>

      <form id="product-form" class="hidden">
        <input id="p-name" type="text" placeholder="Nom du produit" required />
        <input id="p-price" type="number" step="0.01" min="0.01" placeholder="Prix (€)" required />
        <input id="p-image" type="url" placeholder="URL de l'image (optionnel)" />
        <textarea id="p-desc" rows="2" placeholder="Description (optionnel)"></textarea>
        <button type="submit">Publier</button>
      </form>

      <div id="products" class="grid"></div>
    </section>

    <section id="chat-section">
      <h2>Assistant JUST3D</h2>
      <div id="chat-box"></div>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="Posez votre question…" autocomplete="off" required />
        <button type="submit">Envoyer</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Pour une impression 3D <strong>personnalisée</strong>, contactez-nous par email :
      <a id="contact-email" href="#"></a>
    </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
